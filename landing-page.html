<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBus — Hệ thống vé xe buýt thông minh</title>

  <!-- Pinned CDN Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>
    // Safeguard FramerMotion global
    window.Motion = window.Motion || window.FramerMotion || (window.MotionPlugin && window.MotionPlugin.Motion);
  </script>

  <!-- Google Fonts: Open Sans (Full Vietnamese Support, weights 300–800 + italics) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Open Sans"', 'sans-serif'],
            body: ['"Open Sans"', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: "9999px",
          },
        },
      },
    };
  </script>

  <!-- Liquid-Glass & Core CSS -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', 'Segoe UI', sans-serif;
    }

    /* Subtle liquid-glass utility */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Strong liquid-glass utility */
    .liquid-glass-strong {
      background: rgba(14, 14, 22, 0.75);
      backdrop-filter: blur(45px);
      -webkit-backdrop-filter: blur(45px);
      border: none;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.6) 0%,
        rgba(255, 255, 255, 0.2) 20%,
        rgba(255, 255, 255, 0) 45%,
        rgba(255, 255, 255, 0.1) 75%,
        rgba(255, 255, 255, 0.5) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    html {
      scroll-behavior: smooth;
    }

    .hero-bg {
      background: radial-gradient(circle at 50% 25%, rgba(20, 60, 140, 0.4) 0%, rgba(8, 12, 24, 0.95) 60%, #000000 100%);
    }

    .capabilities-bg {
      background: radial-gradient(circle at 50% 35%, rgba(55, 48, 107, 0.4) 0%, rgba(8, 8, 15, 0.95) 65%, #000000 100%);
    }

    /* ===== Animated bus & e-ticket scene ===== */
    @keyframes sb-drive {
      from { transform: translateX(-45vw); }
      to   { transform: translateX(135vw); }
    }
    @keyframes sb-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes sb-wheel {
      to { transform: rotate(360deg); }
    }
    .sb-wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: sb-wheel 0.65s linear infinite;
    }
    @keyframes sb-dash {
      from { background-position-x: 0; }
      to { background-position-x: -110px; }
    }
    @keyframes sb-twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.85; }
    }
    @keyframes sb-float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-13px) rotate(-3deg); }
    }
    @keyframes sb-scan {
      0%, 100% { top: 10%; }
      50% { top: 84%; }
    }
    @keyframes sb-glow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.8; }
    }
    @keyframes sb-dashflow {
      to { stroke-dashoffset: -290; }
    }
    @keyframes sb-pulse-ring {
      0% { transform: scale(0.55); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .sb-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: sb-pulse-ring 2.6s ease-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .sb-anim, .sb-anim * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Film grain noise overlay -->
  <svg style="position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.035; z-index: 99999;">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>

  <div id="root"></div>

  <!-- Components & App Script -->
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    
    // Robust Framer Motion fallback ensures no black screen even if CDN has delay
    const motionObj = window.Motion && window.Motion.motion ? window.Motion.motion : null;
    const motion = motionObj || {
      div: (props) => <div {...props} />,
      p: (props) => <p {...props} />,
      span: (props) => <span {...props} />,
      section: (props) => <section {...props} />,
      header: (props) => <header {...props} />,
      button: (props) => <button {...props} />,
    };

    // Suppress benign Framer Motion dev key warnings
    const origError = console.error;
    console.error = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('Each child in a list should have a unique "key" prop')) return;
      origError.apply(console, args);
    };

    // ==========================================
    // 1. ANIMATED BUS SCENE — xe buýt chạy trong đêm thành phố + vé QR
    // ==========================================
    const HERO_STARS = [
      { left: '4%',  top: '9%',  size: 2,   delay: '0s' },

      { left: '27%', top: '15%', size: 1.5, delay: '2.1s' },
      { left: '35%', top: '5%',  size: 2,   delay: '0.3s' },
      { left: '44%', top: '12%', size: 1.5, delay: '1.6s' },
      { left: '53%', top: '6%',  size: 2.5, delay: '0.9s' },
      { left: '62%', top: '17%', size: 1.5, delay: '2.5s' },
      { left: '70%', top: '8%',  size: 2,   delay: '0.4s' },
      { left: '79%', top: '14%', size: 1.5, delay: '1.1s' },

    const SKYLINE_WINDOWS = [

    }

    function HeroBusScene() {
      return (
        <div className="sb-anim absolute inset-0 z-0 pointer-events-none overflow-hidden" aria-hidden="true">
          {/* Twinkling stars */}
          {HERO_STARS.map((st, i) => (

          {/* Road */}

                background: 'repeating-linear-gradient(90deg, rgba(125, 211, 252, 0.55) 0 46px, transparent 46px 110px)',

          {/* Bus stop marker */}

              <svg viewBox="0 0 340 150" style={{ width: 'clamp(280px, 36vw, 430px)', height: 'auto', display: 'block' }}>
                <defs>
                  <linearGradient id="sbBusBody" x1="0" y1="0" x2="0" y2="1">

                    <stop offset="55%" stopColor="#123c63" />

                    <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.55" />

                  <linearGradient id="sbBusStripe" x1="0" y1="0" x2="1" y2="0">

                {/* body */}
                <rect x="22" y="26" width="290" height="88" rx="17" fill="url(#sbBusBody)" stroke="rgba(125, 211, 252, 0.55)" strokeWidth="1.5" />
                <rect x="120" y="17" width="74" height="11" rx="5" fill="#0e2f4d" stroke="rgba(125, 211, 252, 0.35)" strokeWidth="1" />

                <rect x="206" y="38" width="16" height="34" rx="3" fill="url(#sbBusGlass)" />

                {/* stripe & branding */}
                <rect x="22" y="80" width="290" height="6" fill="url(#sbBusStripe)" opacity="0.85" />

                {/* lights */}
                <circle cx="310" cy="64" r="4.5" fill="#fde68a" />
                <ellipse cx="322" cy="64" rx="18" ry="12" fill="url(#sbBeam)" />
                <rect x="20" y="56" width="5" height="11" rx="2.5" fill="#f87171" />

                {/* wheels */}
                <circle cx="88" cy="116" r="18" fill="#020617" stroke="#1f2b3d" strokeWidth="3" />
                <g className="sb-wheel">
                  <rect x="80" y="114.4" width="16" height="3.2" rx="1.6" fill="#94a3b8" />
                  <rect x="86.4" y="108" width="3.2" height="16" rx="1.6" fill="#94a3b8" />

        </div>
      );
    }

    // ==========================================
    // 1.5 ROUTE MAP SCENE — xe buýt chạy theo lộ trình giữa các trạm

    // ==========================================
    // 2. BLUR TEXT COMPONENT (Word-by-word animation)
    // ==========================================
    function BlurText({ text, className }) {
      const containerRef = useRef(null);
      const [inView, setInView] = useState(true);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) {
          observer.observe(containerRef.current);
        }

        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
