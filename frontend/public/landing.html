  <script type="text/babel">
    const { useEffect, useRef, useState, useCallback } = React;
    
    // Robust Framer Motion fallback ensures no black screen even if CDN has delay
    const motionObj = window.Motion && window.Motion.motion ? window.Motion.motion : null;
    const motion = motionObj || {
      div: (props) => <div {...props} />,
      p: (props) => <p {...props} />,
      span: (props) => <span {...props} />,
      section: (props) => <section {...props} />,
      header: (props) => <header {...props} />,
      button: (props) => <button {...props} />,
    };

    // Suppress benign Framer Motion dev key warnings
    const origError = console.error;
    console.error = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('Each child in a list should have a unique "key" prop')) return;
      origError.apply(console, args);
    };

    // ==========================================
    // 1. FADING VIDEO COMPONENT (Safe Crossfade + AutoPlay)
    // ==========================================
    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafIdRef = useRef(null);
      const fadingOutRef = useRef(false);

      const fadeTo = useCallback((target, duration = 600) => {
        if (rafIdRef.current) {
          cancelAnimationFrame(rafIdRef.current);
        }
        const video = videoRef.current;
        if (!video) return;

        const startOpacity = parseFloat(video.style.opacity !== '' ? video.style.opacity : 1);
        const startTime = performance.now();

        function step(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const current = startOpacity + (target - startOpacity) * progress;
          if (videoRef.current) {
            videoRef.current.style.opacity = current;
          }
          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(step);
          } else {
            rafIdRef.current = null;
          }
        }

        rafIdRef.current = requestAnimationFrame(step);
      }, []);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        // Default to visible so user never sees plain black void
        video.style.opacity = '0.9';

        const tryPlay = () => {
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              fadeTo(1, 500);
            }).catch(() => {
              // Browser autoplay policy might hold until user interaction
              video.style.opacity = '1';
            });
          }
        };

        const handleLoadedData = () => {
          tryPlay();
        };

        const handleCanPlay = () => {
          tryPlay();
        };

        const handleTimeUpdate = () => {
          if (
            !fadingOutRef.current &&
            video.duration &&
            video.duration - video.currentTime <= 0.6 &&
            video.duration - video.currentTime > 0
          ) {
            fadingOutRef.current = true;
            fadeTo(0, 600);
          }
        };

        const handleEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            if (!videoRef.current) return;
            videoRef.current.currentTime = 0;
            videoRef.current.play().then(() => {
              fadingOutRef.current = false;
              fadeTo(1, 600);
            }).catch(() => {
              video.style.opacity = '1';
            });
          }, 80);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('canplay', handleCanPlay);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        if (video.readyState >= 2) {
          tryPlay();
        }

        // Global click resume in case browser blocked audio/video playback
        const handleUserClick = () => {
          if (video.paused) {
            video.play().catch(() => {});
          }
        };
        window.addEventListener('click', handleUserClick, { once: true });

        return () => {
          if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('canplay', handleCanPlay);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          window.removeEventListener('click', handleUserClick);
        };
      }, [fadeTo, src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          loop={false}
          preload="auto"
          className={className}
          style={{ opacity: 0.9, ...style }}
        />
      );
    }

    // ==========================================
    // 2. BLUR TEXT COMPONENT (Word-by-word animation)
    // ==========================================
    function BlurText({ text, className }) {
      const containerRef = useRef(null);
      const [inView, setInView] = useState(true);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) {
          observer.observe(containerRef.current);
        }

        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
          ref={containerRef}
          className={className}
          style={{
            display: 'flex',
            flexWrap: 'wrap',
            justifyContent: 'center',
            rowGap: '0.1em',
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(8px)', opacity: 0.2, y: 30 }}
              animate={
                inView
                  ? {
                      filter: ['blur(8px)', 'blur(2px)', 'blur(0px)'],
                      opacity: [0.2, 0.7, 1],
                      y: [30, -3, 0],
                    }
                  : { filter: 'blur(0px)', opacity: 1, y: 0 }
              }
              transition={{
                duration: 0.6,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: (i * 80) / 1000,
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

                </a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ==========================================
    // 7. ROOT APP COMPONENT (With Scroll Spy)
    // ==========================================
    function App() {
      const [activeSection, setActiveSection] = useState('hero');

      useEffect(() => {
        const sectionIds = ['hero', 'routes', 'capabilities', 'tickets', 'operations'];
        const handleScroll = () => {
          const scrollPosition = window.scrollY + 250;
          for (const id of sectionIds) {
            const el = document.getElementById(id);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(id);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="relative w-full bg-black selection:bg-cyan-400 selection:text-black">
          <Navbar activeSection={activeSection} setActiveSection={setActiveSection} />
          <HeroSection />
          <RoutesSection />
          <CapabilitiesSection />
          <TicketsSection />
          <OperationsSection />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
