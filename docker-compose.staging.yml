version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: staging-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: smartbus_admin
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: smartbus_staging
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_staging:/var/lib/mysql
    networks:
      - smartbus-network

  redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - smartbus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staging-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: mysql://smartbus_admin:${DB_PASSWORD}@database:3306/smartbus_staging
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - smartbus-network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: mysql://smartbus_admin:${DB_PASSWORD}@database:3306/smartbus_staging
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smartbus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staging-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - smartbus-network

  reverse-proxy:
    image: nginx:alpine
    container_name: staging-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - smartbus-network

volumes:
  mysql_data_staging:

networks:
  smartbus-network:
    driver: bridge
