version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: staging-postgres
    restart: always
    environment:
      POSTGRES_USER: smartbus_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smartbus_staging
    ports:
      - "5432:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    networks:
      - smartbus-network

  redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - smartbus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staging-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://smartbus_admin:${DB_PASSWORD}@database:5432/smartbus_staging
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database
      - redis
    networks:
      - smartbus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staging-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - smartbus-network

  reverse-proxy:
    image: nginx:alpine
    container_name: staging-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - smartbus-network

volumes:
  pgdata_staging:

networks:
  smartbus-network:
    driver: bridge
