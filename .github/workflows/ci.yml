name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  validate:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Kiểm tra Backend
      - name: Backend - Install, Lint, Test & Build
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npm run lint || true
          npm run test -- --passWithNoTests
          npm run build

      # Kiểm tra Frontend
      - name: Frontend - Install, Lint, Test & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint || true
          npm run test -- --passWithNoTests
          npm run build
