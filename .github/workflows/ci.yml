name: CI Pipeline

on:
  push:
    branches: [Develop, develop, main]
  pull_request:
    branches: [Develop, develop, main]

jobs:
  validate:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Kiểm tra Backend
      - name: Backend - Install, Lint, Test & Build
        working-directory: ./backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test -- --runInBand
          npm run build
          npm run test:postgres
          npm run test:trip-cleanup
          npm run test:serverless

      # Kiểm tra Frontend
      - name: Frontend - Install, Lint, Test & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
